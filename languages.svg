  @keyframes l-fb{0%,100%{transform:translate(0,0)}50%{transform:translate(-22px,16px)}}
  @keyframes l-fc{0%,100%{transform:translate(0,0)}50%{transform:translate(16px,-10px)}}
  @keyframes l-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes l-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes l-pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes l-sweep{0%{transform:translateX(-260px)}60%,100%{transform:translateX(1100px)}}
  @keyframes l-wave{0%{opacity:0}6%{opacity:.55}14%,100%{opacity:0}}
  @keyframes l-twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
